<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Upload First Document - DocNova Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#414658",
                        "surface-container": "#e5eeff",
                        "surface-variant": "#d3e4fe",
                        "surface-container-highest": "#d3e4fe",
                        "on-background": "#0b1c30",
                        "inverse-surface": "#213145",
                        "tertiary-fixed-dim": "#4cd7f6",
                        "surface-container-high": "#dce9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary-fixed-variant": "#004e5c",
                        "on-surface": "#0b1c30",
                        "tertiary": "#005e6e",
                        "surface-container-low": "#eff4ff",
                        "outline": "#737686",
                        "on-tertiary-fixed": "#001f26",
                        "on-secondary-container": "#5d6274",
                        "on-primary-fixed": "#00174b",
                        "secondary-fixed": "#dee1f7",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b4c5ff",
                        "primary-container": "#2563eb",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "outline-variant": "#c3c6d7",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "tertiary-container": "#00788c",
                        "background": "#f8f9ff",
                        "on-tertiary-container": "#d7f6ff",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary-fixed": "#acedff",
                        "secondary-fixed-dim": "#c2c6db",
                        "secondary-container": "#dbdff4",
                        "surface-tint": "#0053db",
                        "primary-fixed": "#dbe1ff",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "on-secondary-fixed": "#161b2b",
                        "primary": "#004ac6",
                        "secondary": "#595e70",
                        "on-surface-variant": "#434655",
                        "surface": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "stack-lg": "32px",
                        "margin-desktop": "40px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-md": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8F9FC;
        }
        .custom-shadow {
            box-shadow: 0 4px 6px -1px rgba(10, 15, 30, 0.1), 0 2px 4px -2px rgba(10, 15, 30, 0.05);
        }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center font-body-md text-on-surface">
<!-- Progress Top Bar -->
<div class="fixed top-0 left-0 w-full bg-surface-container-lowest border-b border-outline-variant py-4 px-margin-mobile md:px-margin-desktop flex justify-center items-center z-50">
<div class="flex items-center gap-2">
<!-- Step 1 -->
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary text-on-primary">
<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="w-12 h-1 bg-primary rounded-full mx-1"></div>
<!-- Step 2 (Current) -->
<div class="flex items-center justify-center w-8 h-8 rounded-full border-2 border-primary-container text-primary-container font-label-md">
                2
            </div>
<div class="w-12 h-1 bg-outline-variant rounded-full mx-1"></div>
<!-- Step 3 -->
<div class="flex items-center justify-center w-8 h-8 rounded-full border-2 border-outline-variant text-outline-variant font-label-md">
                3
            </div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[640px] px-margin-mobile mt-24 pb-12 flex flex-col gap-stack-lg">
<!-- Header Section -->
<header class="text-center flex flex-col gap-unit">
<h1 class="font-headline-lg text-headline-lg md:font-display-md md:text-display-md">Upload your first document.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Let's see DocNova in action with a real file.</p>
</header>
<!-- Upload Card -->
<div class="bg-surface-container-lowest border border-[#E2E8F0] rounded-lg custom-shadow p-gutter flex flex-col gap-stack-lg">
<!-- Dropzone -->
<div class="border-2 border-dashed border-[#CBD5E1] rounded-lg p-stack-lg flex flex-col items-center justify-center text-center gap-stack-sm hover:bg-surface-container-low transition-colors cursor-pointer group">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary-container mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">cloud_upload</span>
</div>
<p class="font-title-lg text-title-lg text-on-surface">Drop a document here</p>
<p class="font-body-md text-body-md text-on-surface-variant">or <span class="text-primary-container font-medium hover:underline cursor-pointer">Choose File</span></p>
<p class="font-body-sm text-body-sm text-outline mt-2">Supported formats: PDF, DOCX, TXT (Max 50MB)</p>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">or try a sample</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Sample Docs Row -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-stack-md">
<!-- Sample 1 -->
<button class="flex flex-col items-center justify-center gap-2 p-4 border border-[#E2E8F0] rounded-lg hover:border-primary-container hover:bg-surface-container-low transition-all text-left w-full">
<span class="material-symbols-outlined text-tertiary-container" style="font-variation-settings: 'FILL' 1;">insert_chart</span>
<span class="font-label-md text-label-md text-on-surface text-center">Q3 Finance Report</span>
</button>
<!-- Sample 2 -->
<button class="flex flex-col items-center justify-center gap-2 p-4 border border-[#E2E8F0] rounded-lg hover:border-primary-container hover:bg-surface-container-low transition-all text-left w-full">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">gavel</span>
<span class="font-label-md text-label-md text-on-surface text-center">Legal Contract Sample</span>
</button>
<!-- Sample 3 -->
<button class="flex flex-col items-center justify-center gap-2 p-4 border border-[#E2E8F0] rounded-lg hover:border-primary-container hover:bg-surface-container-low transition-all text-left w-full">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">science</span>
<span class="font-label-md text-label-md text-on-surface text-center">Research Summary</span>
</button>
</div>
</div>
<!-- Action Area -->
<div class="flex flex-col gap-stack-md mt-4">
<div class="flex justify-between items-center">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors flex items-center gap-2 py-2 px-4 rounded-md hover:bg-surface-container">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                    Back
                </button>
<button class="h-[44px] bg-[#2563EB] text-white font-label-md text-label-md px-8 rounded-md hover:bg-primary transition-colors flex items-center gap-2">
                    Continue
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
<div class="text-center">
<button class="font-body-sm text-body-sm text-outline hover:text-on-surface transition-colors underline-offset-4 hover:underline">
                    Skip this step
                </button>
</div>
</div>
</main>
</body></html>
