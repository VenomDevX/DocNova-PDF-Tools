services:
  - type: web
    name: docnova-pdf-tools
    runtime: docker
    plan: free
    # Build context is backend/ so the Dockerfile's COPY steps resolve correctly.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # gunicorn (start.sh) binds to $PORT; keep it aligned with the
      # Dockerfile's EXPOSE/HEALTHCHECK port.
      - key: PORT
        value: 5000
